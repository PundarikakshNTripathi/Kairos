<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:;" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kairos shows your whole life as a grid of days and counts down what is left." />
    <meta name="theme-color" content="#0a0908" />
    <title>Kairos</title>
      <script>
      try {
        var s = JSON.parse(localStorage.getItem('kairos-storage'));
        var t = (s && s.state && s.state.theme) || 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
